<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="NadaRuang adalah pemutar musik untuk menikmati lagu, lirik, playlist, dan koleksi musik Anda."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>NadaRuang - Pemutar Musik</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #020617; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
      header.auth-critical-header { box-sizing: border-box; height: 4.25rem; padding: 1.5rem 1rem; }
      .auth-critical-brand { color: #c4b5fd; font-size: .875rem; line-height: 1.25rem; font-weight: 600; text-decoration: none; }
      main.auth-critical-main { box-sizing: border-box; display: flex; min-height: calc(100vh - 4.5rem); align-items: center; justify-content: center; padding: 2rem 1rem; }
      section.auth-critical-card { box-sizing: border-box; width: 100%; max-width: 28rem; min-height: 36rem; padding: 1.5rem; border: 1px solid #1e293b; border-radius: 1.5rem; background: #0f172a; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
      section.auth-critical-card h1 { margin: 1.5rem 0 0; font-size: 1.875rem; line-height: 2.25rem; font-weight: 700; }
      section.auth-critical-card p { margin: .5rem 0 0; color: #94a3b8; font-size: .875rem; line-height: 1.25rem; }
      .auth-critical-card input { box-sizing: border-box; width: 100%; padding: .75rem 1rem; border: 1px solid #334155; border-radius: .75rem; background: #020617; color: #f8fafc; }
      .auth-critical-card button[type="submit"] { width: 100%; padding: .75rem 1rem; border: 0; border-radius: .75rem; background: #a78bfa; color: #020617; font-weight: 600; }
      @media (min-width: 640px) { section.auth-critical-card { padding: 2rem; } }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="auth-critical-header">
        <nav aria-label="Navigasi autentikasi" class="mx-auto max-w-md">
          <a href="/" class="auth-critical-brand">NadaRuang</a>
        </nav>
      </header>
      <main class="auth-critical-main">
        <section class="auth-critical-card">
          <h1>NadaRuang</h1>
          <p>Memuat halaman…</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
