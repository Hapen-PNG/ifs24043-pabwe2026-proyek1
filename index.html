<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="NadaRuang adalah pemutar musik untuk menikmati lagu, lirik, playlist, dan koleksi musik Anda."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>NadaRuang - Pemutar Musik</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #020617; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main.auth-critical-main { box-sizing: border-box; display: flex; min-height: calc(100vh - 4.5rem); align-items: center; justify-content: center; padding: 2rem 1rem; }
      main.initial-loading { flex-direction: column; gap: .5rem; text-align: center; }
      main.initial-loading h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
      main.initial-loading p { margin: 0; font-size: .875rem; color: #cbd5e1; }
      section.auth-critical-card { box-sizing: border-box; width: 100%; max-width: 28rem; padding: 1.5rem; border: 1px solid #1e293b; border-radius: 1.5rem; background: #0f172a; }
      .auth-critical-card input { box-sizing: border-box; width: 100%; padding: .75rem 1rem; border: 1px solid #334155; border-radius: .75rem; background: #020617; color: #f8fafc; }
      .auth-critical-card button[type="submit"] { width: 100%; padding: .75rem 1rem; border: 0; border-radius: .75rem; background: #a78bfa; color: #020617; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="auth-critical-main initial-loading">
        <h1>NadaRuang</h1>
        <p>Memuat halaman…</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
